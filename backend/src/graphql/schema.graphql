scalar JSON
scalar DateTime

enum SessionStatus {
  PENDING
  "En file d'attente : la limite de sessions simultanées (serveur ou projet) est atteinte, la session démarre dès qu'une place se libère."
  QUEUED
  RUNNING
  COMPLETED
  FAILED
  STOPPED
  INTERRUPTED
}

type ConfigOption {
  value: String!
  label: String!
  description: String
}

type ConfigField {
  key: String!
  label: String!
  type: String!
  required: Boolean!
  description: String
  options: [ConfigOption!]
  defaultValue: String
  "Affiché dans la section « Options avancées »."
  advanced: Boolean
}

"Un type d'agent que l'on peut exécuter en session (Claude, shell, ...)."
type Provider {
  type: String!
  label: String!
  description: String!
  "true si l'on peut envoyer des instructions à une session en cours."
  interactive: Boolean!
  configFields: [ConfigField!]!
}

"Pour une session en cours : l'agent travaille ou attend des instructions."
enum SessionActivity {
  BUSY
  IDLE
}

# ---- Utilisateurs et accès ----------------------------------------------------------------------

"Rôle d'un utilisateur sur un projet : ADMIN gère le projet et ses membres, MEMBER lance sessions et terminaux, VIEWER consulte seulement."
enum ProjectRole {
  ADMIN
  MEMBER
  VIEWER
}

"Utilisateur de l'application (connexion Google). Il n'existe que s'il a été invité sur un projet."
type User {
  id: ID!
  email: String!
  name: String!
  avatarUrl: String
  "Administrateur de l'application : accès aux paramètres généraux et aux utilisateurs."
  isAdmin: Boolean!
  "Super administrateur : administrateur de l'application qui administre aussi tous les projets, membre ou non."
  isSuperAdmin: Boolean!
  createdAt: DateTime!
  "Null tant que l'utilisateur ne s'est jamais connecté."
  lastLoginAt: DateTime
}

"Appartenance d'un utilisateur à un projet."
type ProjectMember {
  user: User!
  role: ProjectRole!
  invitedBy: User
  createdAt: DateTime!
  "Invité mais jamais connecté."
  pending: Boolean!
}

"Compte rendu de l'import d'une archive de projet."
type ProjectImportReport {
  foldersCreated: Int!
  instructionsCreated: Int!
  "Instructions déjà présentes au même chemin, laissées telles quelles."
  instructionsSkipped: [String!]!
  tasksCreated: Int!
  commentsCreated: Int!
  settingsUpdated: Boolean!
  "Connexions de l'archive : jamais recréées (leurs secrets n'y sont pas)."
  connections: [String!]!
}

"Un projet regroupe des sessions ; chacune s'exécute dans le workspace du projet."
type Project {
  id: ID!
  name: String!
  "Nom du dossier du projet dans WORKSPACES_ROOT (fixé à la création)."
  slug: String!
  description: String
  "Ajouté au prompt système des agents qui le supportent."
  systemPrompt: String!
  "Consignes ajoutées à l'instruction de toute session qui réalise une tâche du projet, après le texte de la tâche (vide : aucune)."
  taskInstructions: String!
  gitUrl: String
  gitBranch: String
  "Réglages du conteneur Docker du projet : { image, memory, cpus, browser }."
  runnerConfig: JSON!
  "Mode d'autorisation des nouvelles sessions qui n'en précisent pas (default, acceptEdits, bypassPermissions, plan)."
  defaultPermissionMode: String!
  "Limite de contexte des nouvelles sessions qui n'en choisissent pas (tâches, sessions lancées par un agent), présélectionnée au lancement : contextAction « compact » ou « reset » au-delà de contextMaxTokens. Null : aucune limite (l'interface propose au-delà du seuil de signalement)."
  defaultContextCleanup: SessionCleanup
  "Noms des éléments du coffre dont les usages par les agents sont soumis à l'approbation d'un humain (même en mode bypassPermissions)."
  approvalConnections: [String!]!
  "Faux quand l'utilisateur atteint le projet en tant que super administrateur sans en être membre."
  isMember: Boolean!
  "Espace personnel : projet qui n'appartient qu'à une personne (jamais partagé), où elle ouvre ses sessions, ses chats et ses tâches."
  isPersonal: Boolean!
  runnerStatus: RunnerStatus!
  "Mémoire, CPU et processus Claude du conteneur (mesurés à la demande) ; null s'il n'est pas en marche."
  containerStats: ContainerStats
  "Chemin absolu du workspace sur le serveur."
  workspacePath: String!
  workspaceExists: Boolean!
  "Branche et commit courants du workspace, si c'est un dépôt git."
  git: WorkspaceGit
  createdAt: DateTime!
  updatedAt: DateTime!
  sessions(status: SessionStatus, limit: Int, offset: Int): [Session!]!
  "Bibliothèque de contexte : dossiers et instructions à plat, avec leur chemin ; agentId : la bibliothèque propre d’un agent du projet."
  contextFolders(agentId: ID): [ContextFolder!]!
  contextInstructions(agentId: ID): [ContextInstruction!]!
  contextChanges(limit: Int, agentId: ID): [ContextChange!]!
  "Terminaux de l'utilisateur connecté dans ce projet."
  terminals: [Terminal!]!
  tasks(status: [TaskStatus!]): [Task!]!
  "Work sessions actives."
  worksessions: [Worksession!]!
  "Work sessions archivées, les plus récemment archivées d'abord."
  archivedWorksessions: [Worksession!]!
  "Dossiers de travail sur disque (work sessions actives, archivées et orphelines) : place occupée, fusion, occupation. refresh : nouvelle mesure des tailles (sinon gardées 10 min) et fetch d'origin."
  worksessionDisk(refresh: Boolean = false): WorksessionDiskReport!
  "Éléments du coffre à disposition des agents de ce projet (pour les sessions de l'utilisateur connecté)."
  vaultItems: [ProjectVaultItem!]!
  "Clés d'API du projet (administrateurs)."
  apiKeys: [ProjectApiKey!]!
  members: [ProjectMember!]!
  "Rôle de l'utilisateur connecté sur ce projet."
  myRole: ProjectRole!
  "Autorisations d'outils mémorisées pour le projet (« ne plus demander dans ce projet »)."
  permissionRules: [PermissionRule!]!
  "Dépôt git hébergé par Skipper (dépôt nu sur le serveur, servi sous /api/git/<slug>.git, sauvegardé en base) ; gitUrl est alors son URL de clone."
  gitHosted: Boolean!
  "État du dépôt hébergé ; null pour un projet non hébergé."
  hostedGit: HostedGit
}

"Règle d'autorisation d'outil mémorisée pour un projet, au format des permissions Claude Code (Read, Bash(git status:*)...)."
type PermissionRule {
  id: ID!
  projectId: ID!
  toolName: String!
  "Motif propre à l'outil ; null = tout l'outil."
  ruleContent: String
  "Forme textuelle : toolName ou toolName(ruleContent)."
  rule: String!
  "Session pendant laquelle la règle a été mémorisée, le cas échéant."
  createdBySession: Session
  createdAt: DateTime!
  "Dernier appel d'outil autorisé d'office par la règle ; null = jamais depuis usageTrackedSince."
  lastUsedAt: DateTime
  "Nombre d'appels d'outils autorisés d'office par la règle depuis usageTrackedSince."
  useCount: Int!
  "Début du suivi de l'utilisation (création de la règle, ou mise en place du suivi pour les règles plus anciennes)."
  usageTrackedSince: DateTime!
}

"Dossier de la bibliothèque de contexte d'un projet."
type ContextFolder {
  id: ID!
  projectId: ID!
  "Bibliothèque propre d'un agent (null : bibliothèque du projet)."
  agentId: ID
  parentId: ID
  name: String!
  slug: String!
  "Chemin de slugs depuis la racine, ex. \"api/auth\"."
  path: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Instruction (document Markdown) de la bibliothèque de contexte, versionnée."
type ContextInstruction {
  id: ID!
  projectId: ID!
  "Bibliothèque propre d'un agent (null : bibliothèque du projet)."
  agentId: ID
  folderId: ID
  name: String!
  slug: String!
  path: String!
  description: String!
  content: String!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  versions: [ContextInstructionVersion!]!
}

type ContextInstructionVersion {
  id: ID!
  version: Int!
  name: String!
  description: String!
  content: String!
  changeNote: String
  "'human' (interface) ou 'agent' (session)."
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

"Entrée du journal des modifications du contexte d'un projet."
type ContextChange {
  id: ID!
  "folder.create, folder.rename, folder.move, folder.delete, instruction.create, instruction.update, instruction.move, instruction.delete, instruction.restore"
  kind: String!
  path: String!
  details: JSON!
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  DONE
  CANCELLED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

"Champ libre d'une tâche (lien du ticket, environnement...)."
type TaskField {
  key: String!
  value: String!
}

input TaskFieldInput {
  key: String!
  value: String!
}

"Personne désignée sur une tâche : nom et/ou e-mail libres (au moins l'un des deux)."
type TaskPerson {
  name: String
  email: String
}

"Nom et/ou e-mail ; les deux vides retirent la personne."
input TaskPersonInput {
  name: String
  email: String
}

"Fichier joint à une tâche ou à l'un de ses commentaires ; téléchargeable à GET /api/task-attachments/<tâche>/<id> (cookie de session)."
type TaskAttachment {
  id: ID!
  name: String!
  mediaType: String!
  size: Int!
  createdAt: DateTime!
}

"Personne (membre du projet) ou session d'agent mentionnée dans un message ; `text` est le fragment du corps qui la porte (« @Alice Martin », « @session:d8ae4082 »)."
type TaskMention {
  "'user' ou 'session'."
  kind: String!
  id: ID!
  label: String!
  text: String!
}

"Réactions d'un même emoji sur un message ou sur la tâche : qui a réagi, et si l'utilisateur connecté en fait partie."
type TaskReaction {
  emoji: String!
  count: Int!
  "Noms de celles et ceux (personnes, sessions) qui ont réagi, dans l'ordre."
  actors: [String!]!
  "L'utilisateur connecté a posé cette réaction."
  mine: Boolean!
}

"Quelqu'un que l'on peut mentionner dans le fil d'une tâche : membre du projet ou session d'agent non archivée."
type TaskMentionable {
  "'user' ou 'session'."
  kind: String!
  id: ID!
  label: String!
  "E-mail d'un membre, état d'une session."
  detail: String
  "Texte à insérer dans le message pour mentionner cette cible."
  text: String!
}

"Message du fil d'une tâche (commentaire), par une personne ou un agent (Markdown) : racine, ou réponse à une racine (parentId)."
type TaskComment {
  id: ID!
  "Message racine auquel celui-ci répond ; null pour un message de premier niveau."
  parentId: ID
  "'human' ou 'agent'."
  authorType: String!
  "Nom au moment de l'écriture."
  authorName: String!
  author: User
  authorSession: Session
  body: String!
  "Personnes et sessions mentionnées, dans l'ordre du texte."
  mentions: [TaskMention!]!
  "Réactions au message, par emoji."
  reactions: [TaskReaction!]!
  "Modifiable par l'utilisateur connecté (ses propres commentaires)."
  editable: Boolean!
  "Supprimable : ses propres commentaires, ou administrateur du projet."
  deletable: Boolean!
  "Fichiers joints au commentaire, les plus anciens d'abord."
  attachments: [TaskAttachment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Tâche d'un projet, avec priorité. Créée et mise à jour par les humains ou les agents (outils MCP `tasks`)."
type TaskSessionCost {
  session: Session!
  usd: Float!
}

type Task {
  id: ID!
  project: Project!
  title: String!
  description: String!
  status: TaskStatus!
  "Court libellé de l'avancement dans le statut (« en revue », « bloquée »…), affiché à côté ; posé par les personnes ou par la session en charge (outil MCP `tasks.update`)."
  statusTag: String
  "Étiquettes libres de la tâche, dans l'ordre d'affichage."
  tags: [String!]!
  priority: TaskPriority!
  "La plus récente des sessions en charge, le cas échéant."
  session: Session
  "Toutes les sessions en charge actuellement (plusieurs agents peuvent se partager une tâche), la plus récente d'abord."
  sessionsInCharge: [Session!]!
  "Session dont « Confier à un agent » reprend la conversation (la plus récente en charge, sinon la dernière passée par la tâche, si elle travaille encore dans le dossier de la tâche) ; null : il faut une nouvelle session."
  resumableSession: Session
  "Toutes les sessions passées par la tâche (archivées comprises), la plus récemment reliée d'abord."
  sessions: [Session!]!
  "Coût attribué à la tâche (unité d'affichage : crédits dans une cellule facturée). Chaque tour d'une session est réparti à parts égales entre les tâches auxquelles elle était reliée à ce moment."
  costUsd: Float!
  "Part du coût de chaque session dans celui de la tâche, la plus coûteuse d'abord."
  sessionCosts: [TaskSessionCost!]!
  "'human' ou 'agent'."
  createdByType: String!
  createdBySession: Session
  "Échéance AAAA-MM-JJ."
  dueDate: String
  customFields: [TaskField!]!
  assignee: TaskPerson
  reporter: TaskPerson
  commentCount: Int!
  "Nombre de fichiers joints à la tâche elle-même (ceux de ses commentaires ne comptent pas)."
  attachmentCount: Int!
  "Fichiers joints à la tâche elle-même (pas à ses commentaires), les plus anciens d'abord."
  attachments: [TaskAttachment!]!
  "Messages du fil (racines et réponses à plat, parentId les relie), du plus ancien au plus récent."
  comments: [TaskComment!]!
  "Réactions à la tâche elle-même (son message d'ouverture), par emoji."
  reactions: [TaskReaction!]!
  "Qui l'on peut mentionner dans son fil : membres du projet, puis sessions d'agent non archivées (en cours d'abord)."
  mentionables: [TaskMentionable!]!
  "Branche git de la tâche (work session dédiée task/<slug>), conservée après suppression de la work session."
  branch: String
  "Work session consacrée à la tâche (active de préférence, sinon la dernière archivée) : ses sessions y travaillent toutes."
  worksession: Worksession
  "Pull request GitHub de la branche de la tâche (ouverte de préférence), null si aucune ou si GitHub ne répond pas."
  pullRequest: PullRequest
  "Pull requests suivies de la tâche (objets Skipper : étape, déploiement, note), celles qui attendent une action d'abord."
  pullRequests: [TrackedPullRequest!]!
  "Tâches du même projet dont celle-ci dépend (« bloquée par »), dans l'ordre d'ajout."
  dependsOn: [Task!]!
  "Celles de dependsOn qui ne sont pas terminées (une annulée bloque encore) : tant qu'il en reste, la tâche ne peut pas être confiée à un agent."
  blockedBy: [Task!]!
  "Vrai tant qu'au moins une dépendance n'est pas terminée."
  blocked: Boolean!
  "Tâches qui dépendent de celle-ci."
  dependents: [Task!]!
  "Confiée automatiquement à une session (configuration par défaut du projet) quand sa dernière dépendance passe à terminée ; option consommée au lancement."
  autoStartWhenUnblocked: Boolean!
  "Personne (ou agent) au nom de qui la session sera lancée : celle qui a armé l'option."
  autoStartBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
  completedAt: DateTime
}

input CreateTaskInput {
  projectId: ID!
  title: String!
  description: String
  priority: TaskPriority
  status: TaskStatus
  dueDate: String
  customFields: [TaskFieldInput!]
  statusTag: String
  tags: [String!]
  assignee: TaskPersonInput
  reporter: TaskPersonInput
  "Fichiers joints à la tâche (10 au plus, 10 Mo chacun, 12 Mo au total)."
  attachments: [AttachmentInput!]
  "Tâches du même projet dont celle-ci dépend."
  dependsOnIds: [ID!]
  "Lancer automatiquement quand la dernière dépendance est terminée (au nom de la personne connectée)."
  autoStartWhenUnblocked: Boolean
}

input UpdateTaskInput {
  title: String
  description: String
  priority: TaskPriority
  status: TaskStatus
  "Session qui prend la charge, en plus de celles déjà en charge (null : plus aucune session en charge)."
  sessionId: ID
  "Sessions qui cessent d'être en charge."
  releaseSessionIds: [ID!]
  "Chaîne vide ou null pour retirer l'échéance."
  dueDate: String
  "Remplace la liste complète."
  customFields: [TaskFieldInput!]
  "Absente : inchangée ; null ou vide : retirée."
  statusTag: String
  "Remplace la liste complète des étiquettes."
  tags: [String!]
  "Absent : inchangé ; null : retiré."
  assignee: TaskPersonInput
  reporter: TaskPersonInput
  "Fichiers ajoutés aux pièces jointes de la tâche (celles déjà là restent ; 10 au plus en tout)."
  attachments: [AttachmentInput!]
  "Pièces jointes de la tâche (pas de ses commentaires) à retirer."
  removeAttachmentIds: [ID!]
  "Remplace la liste complète des dépendances (refusé s'il en résulte un cycle)."
  dependsOnIds: [ID!]
  "Arme (au nom de la personne connectée) ou désarme le lancement automatique quand la tâche est débloquée."
  autoStartWhenUnblocked: Boolean
}

"Clé d'API d'un projet (API REST des tâches) ; le secret n'est montré qu'à la création."
type ProjectApiKey {
  id: ID!
  name: String!
  "Début du secret, pour le reconnaître."
  prefix: String!
  createdBy: User
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type CreatedProjectApiKey {
  key: ProjectApiKey!
  "Secret complet, montré cette seule fois."
  secret: String!
}

"Notification affichée dans la cloche de l'interface."
type Notification {
  id: ID!
  "request.created, task.created, task.completed, session.completed, session.failed, context.created… (familles : PushCategory.types)"
  type: String!
  title: String!
  message: String
  "Chemin dans l'application vers l'élément concerné."
  link: String
  project: Project
  session: Session
  payload: JSON!
  "Adressée à cette seule personne (session ou page partagée...)."
  user: User
  readAt: DateTime
  createdAt: DateTime!
}

enum TerminalStatus {
  RUNNING
  CLOSED
}

"Terminal web : un shell interactif lancé dans le workspace du projet, relié par WebSocket (/terminals/<id>)."
type Terminal {
  id: ID!
  project: Project!
  worksession: Worksession
  "Qui a ouvert le terminal : seule cette personne le voit et s'y attache."
  createdBy: User
  name: String!
  status: TerminalStatus!
  exitCode: Int
  createdAt: DateTime!
  closedAt: DateTime
}

"Work session d'un projet : l'unité de travail où tournent sessions et terminaux. Un dossier à elle, à côté du checkout principal : un git worktree sur sa propre branche pour un projet git, un simple dossier sinon."
type Worksession {
  id: ID!
  project: Project!
  "Nom du dossier."
  name: String!
  branch: String!
  "Libellé affiché : le libellé choisi, sinon la branche."
  label: String!
  "Libellé choisi (null : la branche est affichée)."
  customLabel: String
  path: String!
  exists: Boolean!
  git: WorkspaceGit
  archivedAt: DateTime
  "Pull request de la branche (ouverte de préférence), null si aucune ou si GitHub ne répond pas."
  pullRequest: PullRequest
  "PR suivie de la work session (base de Skipper, sans appel GitHub) : ouverte de préférence, sinon en préparation (modifications locales), fusionnée ou fermée."
  trackedPullRequest: TrackedPullRequest
  "Tâche à laquelle la work session est consacrée (sinon : tâche traitée sur sa branche)."
  task: Task
  createdAt: DateTime!
  "Sessions actives."
  sessions: [Session!]!
  "Terminaux de l'utilisateur connecté."
  terminals: [Terminal!]!
}

"Dossiers de travail d'un projet tels qu'ils sont sur disque."
type WorksessionDiskReport {
  "Date de la mesure des tailles (gardées 10 min) ; null : pas encore mesurées."
  computedAt: DateTime
  "Une mesure des tailles tourne (une vingtaine de secondes sur un gros projet) : les tailles données sont les précédentes ; interroger à nouveau."
  measuring: Boolean!
  "Instantanés de dépendances partagés par liens physiques (.skipper-deps), comptés une seule fois."
  sharedBytes: Float
  "Place totale : dossiers et instantanés."
  totalBytes: Float
  entries: [WorksessionDiskEntry!]!
  "Worktrees déclarés à git dont le dossier a disparu (retirés au prochain nettoyage)."
  prunable: [String!]!
}

"Un dossier de travail sur disque."
type WorksessionDiskEntry {
  "Nom du dossier."
  name: String!
  path: String!
  "Work session de Skipper ; null : dossier orphelin (créé hors de Skipper ou dont l'enregistrement a disparu)."
  worksession: Worksession
  branch: String
  exists: Boolean!
  "Le dossier est un git worktree du checkout principal."
  gitWorktree: Boolean!
  "Place occupée en propre : les fichiers partagés par liens physiques (dépendances) ne sont comptés qu'une fois, à l'instantané."
  bytes: Float
  "Commits absents de la branche principale sur origin."
  aheadCount: Int
  "Commits locaux absents de la branche du même nom sur origin (null : pas de branche sur origin)."
  unpushedCount: Int
  "Fichiers modifiés ou non suivis."
  changes: Int
  prMerged: Boolean!
  "Fusionnée : PR fusionnée, ou aucun commit absent de la branche principale."
  merged: Boolean!
  "Sessions non archivées."
  activeSessions: Int!
  "Sessions qui tournent."
  busySessions: Int!
  lastActivityAt: DateTime
  "Dépendances (node_modules) : LINKED liées à l'instantané partagé, COPY copie à part que l'instantané de même lockfile peut remplacer, NO_SNAPSHOT sans instantané ; null : sans objet."
  deps: WorksessionDepsState
  "« Nettoyer les dossiers fusionnés » le supprimerait."
  cleanable: Boolean!
  "Pourquoi il ne serait pas nettoyé."
  blocker: String
}

enum WorksessionDepsState {
  LINKED
  COPY
  NO_SNAPSHOT
}

type WorksessionDepsShareResult {
  relinked: [String!]!
  skipped: [WorksessionCleanupSkip!]!
}

type WorksessionCleanupSkip {
  name: String!
  reason: String!
}

type WorksessionCleanupResult {
  removed: [String!]!
  freedBytes: Float!
  skipped: [WorksessionCleanupSkip!]!
}

# ---- Aperçus ---------------------------------------------------------------------------------------

"État de l'aperçu d'une work session."
enum PreviewStatus {
  "Aucun serveur de développement ne tourne."
  STOPPED
  "Installation des dépendances en cours."
  INSTALLING
  "Serveur lancé, son port ne répond pas encore."
  STARTING
  "Le serveur répond : l'aperçu est consultable."
  RUNNING
  "Installation ou serveur en échec (voir error et le journal)."
  FAILED
}

"Aperçu en direct d'une work session : le serveur de développement de sa branche, lancé dans le conteneur du projet et servi par Skipper sur un sous-domaine réservé aux membres du projet."
type Preview {
  worksessionId: ID!
  "Les aperçus sont activés sur ce serveur (PREVIEW_URL)."
  enabled: Boolean!
  status: PreviewStatus!
  "Une commande est connue : .skipper/preview.json, ou détectée dans un package.json."
  configured: Boolean!
  "D'où vient la commande (« .skipper/preview.json », « Vite détecté dans frontend/package.json »)."
  configSource: String
  ".skipper/preview.json présent mais invalide."
  configError: String
  command: String
  "Adresse de l'aperçu ; pour l'ouvrir, demander un lien d'accès (previewAccessUrl)."
  url: String
  error: String
  startedAt: DateTime
  readyAt: DateTime
  "Dépendances du dernier lancement : snapshot (liées depuis le cache, rien à installer), nearest (liées depuis l'instantané le plus proche puis complétées), present (déjà là), none."
  depsMode: String
  "Installation lancée au dernier lancement (null : aucune, dépendances à jour)."
  installCommand: String
  installMs: Int
  "Du lancement à la première réponse du serveur."
  readyMs: Int
}

# ---- Coffre ----------------------------------------------------------------------------------------

"Type d'élément du coffre."
enum VaultItemKind {
  ssh
  postgres
  website
  google
  api
  secret
  "Compte AWS : connexion par code à IAM Identity Center ou clés d'accès ; les agents exécutent le CLI aws par l'outil aws_run, sans jamais voir les identifiants."
  aws
  "Compte Scaleway : clé d'API IAM ; les agents exécutent le CLI scw (scw_run) et appellent l'API (scw_api) par le serveur, sans jamais voir la clé secrète."
  scaleway
  "Jeton applicatif : identifiant que Skipper utilise pour la personne (Claude, fournisseur OpenCode, GitHub), référencé par ses réglages ; jamais offert aux agents."
  token
  "Proxy LiteLLM : adresse et clé d'API, identifiants des appels de modèle de Skipper (agents automatisés) ; jamais offert aux agents des sessions."
  litellm
  "Projet Langfuse : hôte, clé publique et clé secrète, où Skipper trace ses appels de modèle ; jamais offert aux agents des sessions."
  langfuse
}

"Service que sert un jeton applicatif du coffre."
type VaultTokenService {
  id: String!
  label: String!
  "Début attendu du jeton, quand le service en a un."
  prefix: String
  "Le service est un fournisseur de modèles d'OpenCode."
  opencode: Boolean!
}

"Jeton applicatif : ce qu'il sert (sa valeur ne quitte jamais le coffre)."
type VaultTokenInfo {
  service: String!
  serviceLabel: String!
  "manual : saisi à la main (révélable avec READ) ; oauth : obtenu par une connexion de Skipper (jamais révélable, renouvelé par Skipper)."
  obtained: String!
  "Compte auquel appartient le jeton, quand on le connaît (identifiant GitHub...)."
  account: String
  tokenExpiresAt: DateTime
}

"Permission d'une personne sur un élément : USE (voir et utiliser), READ (aussi révéler les secrets), MANAGE (tout)."
enum VaultPermission {
  USE
  READ
  MANAGE
}

"Portée d'un lien vers un projet : tous ses agents, ou les seules sessions de la personne."
enum VaultLinkScope {
  PROJECT
  PERSONAL
}

"Mode d'authentification d'une API HTTP."
enum VaultApiAuth {
  bearer
  header
  basic
  query
}

"Niveau d'accès des agents à un service Google : NONE, READ (lire, chercher) ou WRITE (aussi envoyer / déposer)."
enum GoogleAccess {
  NONE
  READ
  WRITE
}

"D'où un élément entre dans la portée d'un projet : propriété du projet, lien pour tous les agents, lien personnel."
enum VaultItemVia {
  OWN
  PROJECT
  PERSONAL
}

"Champ d'un site web ou d'un secret."
type VaultField {
  "Clé technique (minuscules, chiffres, soulignés)."
  key: String!
  label: String!
  secret: Boolean!
  "Valeur d'un champ public ; null pour un secret (jamais renvoyé)."
  value: String
  "Nom de variable historique du champ (ex. ADMIN_SITE_PASSWORD), pour l'affichage."
  variable: String!
}

"Compte AWS : mode d'authentification et identité ; les clés et jetons ne sont jamais renvoyés."
type VaultAwsInfo {
  "sso : IAM Identity Center (connexion par code, jetons renouvelés par Skipper) ; keys : clés d'accès."
  auth: String!
  "Région par défaut des commandes."
  region: String!
  "sso : adresse du portail d'accès et région d'IAM Identity Center."
  startUrl: String
  ssoRegion: String
  "sso : compte et rôle (jeu d'autorisations) choisis après la connexion."
  accountId: String
  accountName: String
  roleName: String
  "keys : identifiant de la clé d'accès ; rôle endossé avec ces clés, le cas échéant."
  accessKeyId: String
  roleArn: String
  "sso : la connexion est en cours de validité (jeton de renouvellement ou jeton d'accès valable)."
  connected: Boolean!
  "sso : expiration du jeton d'accès courant."
  tokenExpiresAt: DateTime
  "Identité (ARN) constatée au dernier test réussi."
  identity: String
}

"Compte Scaleway : clé d'accès publique et portée par défaut ; la clé secrète n'est jamais renvoyée."
type VaultScalewayInfo {
  "Clé d'accès (SCW…)."
  accessKey: String!
  "Organisation et projet par défaut des commandes (UUID), complétés au test de l'élément s'ils manquent."
  organizationId: String
  projectId: String
  "Région (fr-par) et zone (fr-par-1) par défaut des commandes."
  region: String!
  zone: String!
  "Principal de la clé (application ou utilisateur IAM) constaté au dernier test réussi."
  identity: String
}

"Connexion AWS par code en cours : ouvrir verificationUriComplete (ou saisir userCode sur verificationUri), autoriser, puis interroger pollAwsLogin."
type AwsLogin {
  id: ID!
  userCode: String!
  verificationUri: String!
  verificationUriComplete: String!
  expiresAt: DateTime!
  "Secondes à attendre entre deux interrogations."
  interval: Int!
}

"Résultat d'une interrogation : PENDING (attendre `interval` secondes), CONNECTED (jetons enregistrés, `item` à jour), EXPIRED ou DENIED."
type AwsLoginPoll {
  status: String!
  interval: Int!
  item: VaultItem
}

"Compte AWS accessible avec la connexion Identity Center, et les rôles de la personne sur ce compte."
type VaultAwsAccount {
  accountId: String!
  accountName: String!
  email: String
  roles: [String!]!
}

type VaultGoogleAccount {
  email: String!
  name: String
  avatarUrl: String
  gmailAccess: GoogleAccess!
  driveAccess: GoogleAccess!
  "Portées OAuth accordées par Google."
  scopes: [String!]!
}

type VaultShare {
  user: User!
  permission: VaultPermission!
  grantedBy: User
  createdAt: DateTime!
}

type VaultLink {
  id: ID!
  "Projet, quand l'utilisateur en est membre."
  project: Project
  projectName: String!
  scope: VaultLinkScope!
  "Personne dont les sessions utilisent l'élément (portée PERSONAL)."
  user: User
  linkedBy: User
  createdAt: DateTime!
}

"Entrée du journal d'un élément du coffre."
type VaultAuditEvent {
  id: ID!
  "created, updated, secret_changed, key_regenerated, host_key_forgotten, deleted, shared, unshared, linked, unlinked, revealed, tested, used, connected, copied, migrated"
  action: String!
  actor: User
  sessionId: ID
  project: Project
  projectName: String
  ok: Boolean!
  detail: String
  createdAt: DateTime!
}

"Élément du coffre : serveur SSH, base PostgreSQL, API HTTP, site web, secret ou compte Google. Les secrets ne sont jamais renvoyés (sauf révélation explicite, journalisée)."
type VaultItem {
  id: ID!
  "Nom court employé par les agents (ex. prod, rds-prod)."
  name: String!
  kind: VaultItemKind!
  description: String!
  "Propriétaire personnel."
  ownerUser: User
  "Projet propriétaire, quand l'utilisateur en est membre."
  ownerProject: Project
  ownerProjectName: String
  "Permission de l'utilisateur connecté."
  myPermission: VaultPermission!
  "Partage explicite dont bénéficie l'utilisateur connecté (il peut y renoncer)."
  myShare: VaultPermission
  "ssh, postgres : hôte ; api basic : null."
  host: String
  port: Int
  "ssh, postgres : utilisateur ; api basic : utilisateur."
  username: String
  "website : adresse du site ; api, litellm : URL de base ; langfuse : hôte."
  url: String
  "langfuse : clé publique (pk-lf-..., non secrète)."
  langfusePublicKey: String
  "token : service et provenance du jeton."
  token: VaultTokenInfo
  "website, secret : champs ; vide pour les autres types."
  fields: [VaultField!]!
  "postgres : base rattachée ; null = le serveur entier (les agents nomment la base à chaque appel)."
  database: String
  ssl: Boolean
  "postgres : certificat de l'autorité du serveur (PEM), pour une vérification sans contrôle du nom d'hôte."
  sslCa: String
  "postgres : serveur SSH traversé (tunnel), du même propriétaire."
  via: VaultItem
  authScheme: VaultApiAuth
  "api : nom de l'en-tête ou du paramètre qui porte le jeton."
  authName: String
  google: VaultGoogleAccount
  aws: VaultAwsInfo
  scaleway: VaultScalewayInfo
  "postgres : transactions en lecture seule ; api : GET, HEAD et OPTIONS seulement ; aws, scaleway : opérations de consultation seulement."
  readOnly: Boolean!
  "Chaque usage par un agent est soumis à l'approbation d'un humain, même en mode « tout autoriser »."
  requireApproval: Boolean!
  "Valeurs utilisables dans les fichiers d'environnement des sessions ({{vault:nom.champ}}) : écrites en clair dans le dossier de travail, lisibles par l'agent."
  envExport: Boolean!
  "ssh, aws, scaleway : préfixes de commandes autorisés (vide = tout ; ssh : ni enchaînement ni transfert de fichiers avec une liste)."
  commandAllowlist: [String!]!
  "ssh : clé publique à ajouter dans authorized_keys du serveur."
  publicKey: String
  hostFingerprint: String
  hostKeySeenAt: DateTime
  hasSecret: Boolean!
  "Champs secrets que l'utilisateur connecté peut révéler (permission READ ; jamais la clé SSH ni le jeton Google)."
  revealableFields: [String!]!
  secretUpdatedAt: DateTime
  "Rappel de rotation (indicatif)."
  expiresAt: DateTime
  lastTestAt: DateTime
  lastTestOk: Boolean
  lastTestError: String
  "Partages (permission MANAGE ; vide sinon)."
  shares: [VaultShare!]!
  "Liens vers des projets (tous pour MANAGE ; sinon les siens et ceux des projets dont on est membre)."
  links: [VaultLink!]!
  "Journal (permission MANAGE ; vide sinon), le plus récent d'abord. before = identifiant de la dernière entrée reçue."
  audit(limit: Int = 50, before: ID): [VaultAuditEvent!]!
  createdBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Élément tel que la page du coffre d'un projet le montre : d'où il vient et par quel lien."
type ProjectVaultItem {
  item: VaultItem!
  via: VaultItemVia!
  "Lien PROJECT, ou lien PERSONAL de l'utilisateur connecté (null pour OWN)."
  link: VaultLink
  "Les agents du projet peuvent utiliser l'élément. Faux pour les éléments du projet réservés à Skipper (jetons, LiteLLM, Langfuse) : listés pour être gérés, jamais offerts aux agents."
  forAgents: Boolean!
}

input VaultFieldInput {
  key: String!
  label: String
  "Secret : chiffré, jamais renvoyé, saisi par le serveur dans le navigateur à la place de l'agent. Défaut : false (ou inchangé)."
  secret: Boolean
  "Valeur. Pour un secret existant, absente ou null = inchangée."
  value: String
}

"Création ou mise à jour d'un élément (les champs absents sont inchangés)."
input VaultItemInput {
  name: String
  kind: VaultItemKind
  description: String
  host: String
  port: Int
  username: String
  "postgres : base rattachée ; chaîne vide ou null = le serveur entier."
  database: String
  ssl: Boolean
  "postgres : certificat PEM de l'autorité ; chaîne vide pour le retirer."
  sslCa: String
  "postgres : élément SSH du même coffre à traverser ; chaîne vide ou null pour retirer."
  viaItemId: ID
  readOnly: Boolean
  requireApproval: Boolean
  envExport: Boolean
  commandAllowlist: [String!]
  "Rappel de rotation ; null pour retirer."
  expiresAt: DateTime
  "ssh : clé privée à importer (sinon une paire est générée à la création et la clé privée ne quitte jamais le serveur)."
