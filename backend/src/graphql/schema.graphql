# ---- Explorateur de fichiers ---------------------------------------------------------------------

"Entrée d'un dossier du workspace (checkout principal ou work session)."
type FileEntry {
  name: String!
  "Chemin relatif à la racine du workspace, séparateur /."
  path: String!
  "dir, file, symlink ou other."
  kind: String!
  size: Int
  modifiedAt: DateTime
}

type FileContent {
  path: String!
  name: String!
  size: Int!
  modifiedAt: DateTime!
  "true si le fichier semble binaire : content est alors null."
  binary: Boolean!
  content: String
}

enum FileEntryKind {
  dir
  file
}

type GitCommit {
  hash: String!
  shortHash: String!
  subject: String!
  author: String!
  date: DateTime!
}

"Fichier modifié dans un workspace ou une work session (statuts git : M, A, D, R, ?, U...)."
type GitFileChange {
  path: String!
  origPath: String
  indexStatus: String!
  worktreeStatus: String!
  staged: Boolean!
  unstaged: Boolean!
  untracked: Boolean!
  conflicted: Boolean!
}

type GitStatus {
  branch: String
  upstream: String
  ahead: Int!
  behind: Int!
  detached: Boolean!
  changes: [GitFileChange!]!
  headCommit: GitCommit
  "Opération git interrompue (conflits à résoudre, ou à terminer) : merge, rebase, cherry-pick ou revert ; null sinon."
  operation: String
}

type GitBranch {
  name: String!
  current: Boolean!
  remote: Boolean!
  upstream: String
  commit: GitCommit
}

"Référence de l'onglet « Modifications » d'une session."
enum SessionChangesMode {
  "Depuis le commit HEAD au premier démarrage de la session (commits de l'agent compris)."
  COMMIT
  "Modifications non validées seulement : commit de départ inconnu ou disparu du dépôt."
  HEAD
  "Dossier sans git : fichiers modifiés depuis la création de la session, sans diff."
  MTIME
}

"Fichier modifié dans le dossier de travail d'une session depuis son démarrage."
type SessionFileChange {
  path: String!
  "Ancien chemin d'un fichier renommé."
  origPath: String
  "A, M, D, R, C, T ; ? pour un fichier non suivi."
  status: String!
  "Lignes ajoutées et supprimées (null : binaire ou inconnu)."
  additions: Int
  deletions: Int
  untracked: Boolean!
}

"Modifications du dossier de travail d'une session depuis son démarrage."
type SessionChanges {
  mode: SessionChangesMode!
  "Commit de référence (null sans git)."
  baseCommit: String
  files: [SessionFileChange!]!
  "Liste incomplète (dossier sans git trop volumineux)."
  truncated: Boolean!
}

"Modifications d'une branche depuis son point de divergence avec sa branche de base, travail non validé compris."
type GitBranchChanges {
  "null : HEAD détaché."
  branch: String
  baseBranch: String!
  mergeBase: String!
  "Commits de la branche depuis la base."
  commits: Int!
  files: [SessionFileChange!]!
}

type GitDiff {
  "Chemin du fichier, ou hash pour un commit."
  path: String!
  staged: Boolean!
  "Diff unifié."
  text: String!
  binary: Boolean!
  truncated: Boolean!
}

"État de l'environnement d'exécution d'un projet."
type RunnerStatus {
  kind: String!
  ready: Boolean!
  "running, stopped, absent, unavailable..."
  state: String!
  containerName: String
  image: String
  memory: String
  "Plafond CPU (--cpus) ; null : aucun, les cœurs du serveur sont partagés équitablement."
  cpus: String
  startedAt: DateTime
  error: String
  "Le conteneur existe mais a été créé avec une autre configuration ou une image depuis reconstruite : à recréer (fait automatiquement dès que rien ne tourne dans le projet)."
  outdated: Boolean!
  "Raisons lisibles de `outdated` : « option --init ajoutée », « image reconstruite le … », « montage ~/.claude ajouté »…"
  outdatedReasons: [String!]!
  "Processus zombies (terminés mais non récoltés) dans le conteneur ; null s'il ne tourne pas."
  zombies: Int
}

"Mesure du conteneur d'un projet (cgroup v2, lu dans le conteneur)."
type ContainerStats {
  sampledAt: DateTime!
  memoryUsedMb: Int!
  "Limite mémoire du conteneur ; null si illimitée."
  memoryLimitMb: Int
  memoryPercent: Float
  swapUsedMb: Int
  "Utilisation CPU en pourcentage d'un cœur (200 = deux cœurs pleins)."
  cpuPercent: Float
  "Limite CPU en nombre de cœurs ; null si illimitée."
  cpuLimit: Float
  "Cœurs du serveur : plafond effectif quand cpuLimit est null."
  hostCpus: Int!
  "Pression CPU (PSI, moyenne sur 60 s) : part du temps où au moins un processus du conteneur attendait le processeur. null si le noyau ne la fournit pas."
  cpuPressurePercent: Float
  "Processus tués par le noyau faute de mémoire depuis la création du conteneur."
  oomKills: Int!
  "Depuis quand la mémoire dépasse 90 % de la limite (null : sous le seuil)."
  memoryHighSince: DateTime
  claudeProcesses: [ContainerProcess!]!
}

"Processus du CLI Claude Code dans le conteneur d'un projet."
type ContainerProcess {
  pid: Int!
