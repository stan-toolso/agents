# ---- Planification des sessions --------------------------------------------------------------------

"Planification d'une session : à chaque échéance de l'expression cron, l'instruction est envoyée à la session (relancée si elle est terminée)."
type SessionSchedule {
  "Identifiant de la session planifiée (une planification par session au plus)."
  sessionId: ID!
  "Nom affiché de la planification : le sien, sinon celui de la session."
  name: String!
  "Nom saisi pour la planification (null : celui de la session)."
  customName: String
  session: Session!
  project: Project!
  "Cinq champs : minute heure jour mois jour-de-semaine, ou alias (@hourly, @daily, @weekly, @monthly)."
  cron: String!
  "Fuseau IANA dans lequel l'expression est interprétée (ex. Europe/Paris)."
  timezone: String!
  "Instruction envoyée à la session à chaque exécution."
  prompt: String!
  enabled: Boolean!
  "Terminer la session à la fin de chaque exécution (défaut) ; sinon elle reste ouverte aux instructions."
  endAfterRun: Boolean!
  "Outils pré-autorisés pour les seules exécutions de la planification (règles au format Claude Code : Bash(git log *), mcp__vault__sql_query(production)…)."
  allowedTools: [String!]!
  nextRunAt: DateTime
  lastRunAt: DateTime
  "Compte rendu de la dernière exécution : terminée (durée, coût), ignorée (raison) ou en erreur."
  lastResult: String
  "Historique des exécutions, les plus récentes d'abord."
  runs(limit: Int = 20): [ScheduleRun!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Issue d'une exécution planifiée."
enum ScheduleRunStatus {
  RUNNING
  "Terminée sans erreur ni refus."
  DONE
  "Un appel d'outil a été refusé (mode « Ne jamais me demander », refus d'un humain) ou une demande est restée sans réponse : le travail n'a pas pu aller au bout."
  BLOCKED
  FAILED
  "Toujours au travail après le délai d'attente (4 h)."
  TIMEOUT
  "Échéance ignorée (agent au travail, plafond de budget, maintenance…)."
  SKIPPED
  "Échéance manquée pendant un arrêt du serveur, non rattrapée."
  MISSED
}

"Une exécution d'une planification."
type ScheduleRun {
  id: ID!
  "SCHEDULE : à l'échéance ; MANUAL : « Exécuter maintenant »."
  trigger: String!
  "Personne qui l'a lancée à la main."
  triggeredBy: User
  status: ScheduleRunStatus!
  "Échéance visée (null pour une exécution lancée à la main)."
  scheduledFor: DateTime
  startedAt: DateTime!
  finishedAt: DateTime
  durationMs: Int
  "Coût de l'exécution (dans l'unité d'affichage, voir costDisplay)."
  costUsd: Float
  "Raison (ignorée, manquée), erreur, outils refusés ou demande sans réponse (bloquée)."
  message: String
  "Début de la dernière réponse de l'agent."
  answer: String
}

input SessionScheduleInput {
  "Nom de la planification (absent : inchangé ; vide : déduit de l'instruction)."
  name: String
  cron: String!
  timezone: String
  prompt: String!
  "Défaut : true."
  enabled: Boolean
  "Défaut : true."
  endAfterRun: Boolean
  "Outils pré-autorisés pour les exécutions (absent : inchangés ; liste vide : aucun)."
  allowedTools: [String!]
  "Réglage de nettoyage de la session, enregistré en même temps que la planification (absent : inchangé). Proposé par défaut : « fresh »."
  cleanup: SessionCleanupInput
}

extend type Session {
  "Planification de la session (null si elle n'est pas planifiée)."
  schedule: SessionSchedule
}

"Nouvelle planification portée par une session créée pour elle (dans son propre dossier de travail, sans démarrer)."
input CreateScheduledSessionInput {
  projectId: ID!
  name: String!
  cron: String!
  timezone: String
  prompt: String!
  enabled: Boolean
  endAfterRun: Boolean
  allowedTools: [String!]
  cleanup: SessionCleanupInput
  "Provider de la session (défaut : claude)."
  provider: String
  "Réglages du provider (mode d'autorisation, modèle…) ; absent : ceux du projet."
  config: JSON
  "Lance une première exécution tout de suite."
  runNow: Boolean
  "Agent de projet propriétaire de la session planifiée (ses comptes, son budget)."
  agentId: ID
}

enum ScheduleToolSuggestionSource {
  "Refusé pendant une exécution passée (mode « Ne jamais me demander », refus, demande sans réponse)."
  DENIED
  "Demandé pendant une exécution passée, puis accordé par une personne."
  ASKED
  "Élément du coffre « avec approbation » cité par l'instruction."
  PROMPT
}

"Outil à pré-autoriser pour une planification."
type ScheduleToolSuggestion {
  "Règle au format Claude Code, à ajouter aux outils pré-autorisés."
  rule: String!
  source: ScheduleToolSuggestionSource!
  "Nombre d'exécutions passées où l'outil a été refusé ou demandé."
  count: Int!
  lastSeenAt: DateTime
}

extend type Query {
  "Outils à pré-autoriser pour une planification : refusés ou demandés pendant ses dernières exécutions, et éléments du coffre avec approbation cités par l'instruction (sans session : seulement l'instruction)."
  schedulePermissionSuggestions(projectId: ID!, sessionId: ID, prompt: String): [ScheduleToolSuggestion!]!
  "Planifications des sessions non archivées, d'un projet ou de tous les projets accessibles."
  sessionSchedules(projectId: ID): [SessionSchedule!]!
  "Prochaines échéances d'une expression cron (aperçu) ; erreur si l'expression ou le fuseau est invalide."
  scheduleNextRuns(cron: String!, timezone: String, count: Int = 5): [DateTime!]!
}

extend type Mutation {
  "Crée ou remplace la planification de la session."
  setSessionSchedule(id: ID!, input: SessionScheduleInput!): Session!
  clearSessionSchedule(id: ID!): Session!
  "Met en pause (false) ou réactive (true) la planification ; l'échéance est recalculée depuis maintenant."
  setSessionScheduleEnabled(id: ID!, enabled: Boolean!): Session!
  "Crée une session dédiée et sa planification ; renvoie la session."
  createScheduledSession(input: CreateScheduledSessionInput!): Session!
  "Exécute la planification maintenant, sans attendre l'échéance."
  runSessionScheduleNow(id: ID!): Session!
}

# ---- Réglages et nettoyage des sessions -----------------------------------------------------------

"Nettoyage automatique de l'historique d'une session (utile aux sessions planifiées)."
type SessionCleanup {
  "Les événements du transcript plus vieux que N jours sont supprimés (null : jamais)."
  retentionDays: Int
  "Conversation de l'agent : « compact » (compacter) ou « reset » (repartir d'une conversation neuve, avec un résumé) quand le contexte dépasse contextMaxTokens, avant une exécution planifiée et à la fin de chaque autre tour ; « fresh » : conversation neuve avant chaque exécution planifiée. Null : rien (l'interface propose seulement)."
  contextAction: String
  contextMaxTokens: Int
}

"Taille du contexte de l'agent et ce qu'elle implique (jauge de l'en-tête, pastille de la sidebar, bandeau de nettoyage)."
type SessionContext {
  "Tokens du contexte au dernier tour (null : inconnu)."
  tokens: Int
  "Seuil au-delà duquel l'interface propose de compacter ou de repartir d'une conversation neuve : celui des réglages Claude de la personne connectée (null : elle a désactivé le signalement). Aucune action automatique."
  warnTokens: Int
  overThreshold: Boolean!
  "Modèle retenu pour l'estimation : dernier modèle facturé, sinon celui de la configuration."
  model: String
  "Fenêtre de contexte du modèle (tokens)."
  windowTokens: Int!
  "Part de la fenêtre occupée (0 à 1), null si la taille est inconnue."
  share: Float
  "Coût approximatif de la relecture du contexte à froid (cache expiré) au prochain tour, en dollars."
  coldTurnUsd: Float
}

extend type Session {
  context: SessionContext!
}

input SessionCleanupInput {
  retentionDays: Int
  contextAction: String
  contextMaxTokens: Int
}

input UpdateSessionInput {
  name: String
  "Remplace les réglages de nettoyage (un objet vide les retire)."
  cleanup: SessionCleanupInput
}

extend type Session {
  cleanup: SessionCleanup!
  "Taille du contexte de l'agent au dernier tour (tokens), null si inconnue."
  contextTokens: Int
}

extend type Mutation {
  "Renomme la session et/ou remplace ses réglages de nettoyage."
  updateSession(id: ID!, input: UpdateSessionInput!): Session!
  "Applique tout de suite le nettoyage configuré : purge du transcript, puis compaction ou remise à zéro de la conversation si elle dépasse le seuil."
  applySessionCleanup(id: ID!): Session!
  "Compacte tout de suite la conversation de l'agent (/compact), quel que soit le réglage de nettoyage. Erreur si l'agent travaille."
  compactSessionContext(id: ID!): Session!
  "Repart tout de suite d'une conversation neuve (la session en attente est d'abord terminée) ; avec `keepSummary`, les derniers échanges accompagnent la prochaine instruction. Le transcript affiché est conservé."
  resetSessionContext(id: ID!, keepSummary: Boolean = true): Session!
}

# ---- Facturation de la cellule -------------------------------------------------------------------

"Offre de la cellule, telle que le client la voit (montants en euros hors taxes)."
type BillingPlan {
  planName: String!
  baseMonthlyEur: Float!
  includedProjects: Int!
  extraProjectEur: Float!
  creditPriceEur: Float!
  "Crédits qui valent un jour-homme (équivalent affiché à côté des crédits)."
  creditsPerManDay: Float!
  ctoDailyRateEur: Float!
  ctoHoursPerDay: Float!
}

"Réglages complets de la facturation (super administrateur) : l'offre, plus la conversion du coût des modèles en crédits."
type BillingSettings {
  "Faux tant qu'un super administrateur n'a rien enregistré : la page de consommation l'indique."
  configured: Boolean!
  planName: String!
  baseMonthlyEur: Float!
  includedProjects: Int!
  extraProjectEur: Float!
  creditPriceEur: Float!
  "Crédits décomptés pour 1 USD de coût des modèles (jamais montré au client)."
  creditsPerUsd: Float!
  creditsPerManDay: Float!
  ctoDailyRateEur: Float!
  ctoHoursPerDay: Float!
  "Taux USD → EUR, pour le coût réel et la marge."
  usdToEur: Float!
}

input BillingSettingsInput {
  planName: String
  baseMonthlyEur: Float
  includedProjects: Int
  extraProjectEur: Float
  creditPriceEur: Float
  creditsPerUsd: Float
  creditsPerManDay: Float
  ctoDailyRateEur: Float
  ctoHoursPerDay: Float
  usdToEur: Float
}

type BillingSubscription {
  "Projets comptés (hors espaces personnels)."
  projects: Int!
  extraProjects: Int!
  baseEur: Float!
  extraEur: Float!
  totalEur: Float!
}

type BillingUsageProject {
  projectId: ID
  projectName: String
  credits: Float!
  eur: Float!
  manDays: Float!
}

type BillingUsageDay {
  "AAAA-MM-JJ."
  day: String!
  credits: Float!
}

"Usage des agents en crédits : le coût des modèles n'apparaît pas."
type BillingUsage {
  credits: Float!
  eur: Float!
  manDays: Float!
  "Projection de fin de mois (extrapolation linéaire ; égale au réalisé pour un mois clos)."
  projectedCredits: Float!
  projectedEur: Float!
  projectedManDays: Float!
  byProject: [BillingUsageProject!]!
  byDay: [BillingUsageDay!]!
}

"Temps passé par un CTO Toolso, saisi par un super administrateur."
type CtoTimeEntry {
  id: ID!
  "AAAA-MM-JJ."
  day: String!
  hours: Float!
  projectId: ID
  projectName: String
  description: String!
  createdByName: String
  createdAt: DateTime!
}

input CtoTimeEntryInput {
  "AAAA-MM-JJ."
  day: String!
  hours: Float!
  projectId: ID
  description: String
}

type BillingCto {
  hours: Float!
  days: Float!
  eur: Float!
  entries: [CtoTimeEntry!]!
}

"Coût réel des modèles et marge sur l'usage (super administrateur seulement)."
type BillingOperatorView {
  creditsPerUsd: Float!
  usdToEur: Float!
  costUsd: Float!
  costEur: Float!
  projectedCostEur: Float!
  projectedMarginEur: Float!
}

"Relevé mensuel de la cellule : abonnement, usage des agents, temps CTO et facture estimée (euros HT)."
type BillingStatement {
  "AAAA-MM."
  month: String!
  configured: Boolean!
  "Mois en cours : montants provisoires, projection de fin de mois."
  inProgress: Boolean!
  daysInMonth: Int!
  daysElapsed: Float!
  plan: BillingPlan!
  subscription: BillingSubscription!
  usage: BillingUsage!
  cto: BillingCto!
  totalEur: Float!
  projectedTotalEur: Float!
  operator: BillingOperatorView
}

extend type Query {
  "Relevé de consommation du mois AAAA-MM (mois courant par défaut). Administrateurs ; le détail opérateur pour les super administrateurs."
  billingStatement(month: String): BillingStatement!
  "Réglages de facturation (super administrateurs)."
  billingSettings: BillingSettings!
}

extend type Mutation {
  updateBillingSettings(input: BillingSettingsInput!): BillingSettings!
  addCtoTimeEntry(input: CtoTimeEntryInput!): CtoTimeEntry!
  deleteCtoTimeEntry(id: ID!): Boolean!
}

"Unité des coûts : USD (instance sans facturation) ou crédits (cellule dont la facturation est configurée)."
enum CostUnit {
  USD
  CREDIT
}

"""
Unité dans laquelle l'API rend **tous** les champs de coût (`costUsd`, `usd`, `monthUsd`, budgets, `coldTurnUsd`,
coûts des événements du transcript) et attend les budgets saisis. Quand la facturation est configurée, ces champs
portent des crédits malgré leur nom : le coût des modèles en USD ne sort que par `BillingStatement.operator`.
"""
type CostDisplay {
  unit: CostUnit!
  "Prix d'un crédit en euros HT (null en USD)."
  creditPriceEur: Float
}

extend type Query {
  costDisplay: CostDisplay!
}

# ---- Agents de projet ----------------------------------------------------------------------------

"Rôle de départ d'un agent (préremplit instructions, déclencheurs et actions)."
enum AgentKind {
  PRODUCT_MANAGER
  DEVELOPER
  CUSTOM
}

enum AgentManagerRole {
  "Crée l'agent, règle ses comptes, peut le retirer ; reçoit ses demandes quand personne ne l'a convoqué."
  OWNER
  "Modifie l'agent (instructions, déclencheurs, comptes, coffre), répond à ses demandes, le met en pause."
  MANAGER
}

"Une personne, ou un agent de projet (utilisateur qui ne se connecte jamais, propriétaire des sessions qu'il joue)."
enum UserKind {
  PERSON
  AGENT
}

type AgentAvatar {
  "Emoji affiché dans l'avatar (sinon l'initiale du nom)."
  emoji: String
  "Couleur de fond (hex), sinon dérivée du nom."
  color: String
}

"Interrupteurs : ce qui convoque l'agent sans qu'une personne le mentionne."
type AgentTriggers {
  "Une tâche créée par une personne (ou l'API) : l'agent intervient pour la cadrer."
  taskCreated: Boolean!
  "Restreint taskCreated aux tâches portant cette étiquette (vide : toutes)."
  taskCreatedTag: String
  "Une réponse humaine dans le fil d'une tâche où l'agent est intervenu lui revient comme une instruction."
  threadFollowed: Boolean!
  "La pull request d'une tâche est fusionnée : l'agent est prévenu."
  prMerged: Boolean!
  "Une tâche passée par une personne à l'étiquette d'état taskReadyTag : l'agent démarre dessus."
  taskReady: Boolean!
  taskReadyTag: String
}

"Action nommée : une instruction jouée par l'agent, à la demande ou à heures fixes (session planifiée dédiée)."
type AgentAction {
  key: String!
  label: String!
  instruction: String!
  "Expression cron à cinq champs (null : à la demande seulement)."
  cron: String
  timezone: String
  "Session planifiée qui porte l'action quand elle a un cron."
  scheduleSession: Session
}

type AgentManager {
  user: User!
  role: AgentManagerRole!
  createdAt: DateTime!
}

type AgentStats {
  activeSessions: Int!
  sessions: Int!
  "Tâches où l'agent est intervenu."
  tasks: Int!
  monthCostUsd: Float!
  totalCostUsd: Float!
  lastActivityAt: DateTime
}

"""
Un agent de projet : membre du projet qui n'est pas une personne (Product Manager, Developer…). C'est un utilisateur
(`User.kind = AGENT`) avec ses propres comptes (réglages Claude, GitHub, GitLab, coffre personnel : page Paramètres en
mode « pour l'agent », `?actAs=<id>` sur l'URL GraphQL, réservé à ses gestionnaires) ; tout ce qu'il fait est une
session dont il est le propriétaire. On le convoque en le mentionnant dans le fil d'une tâche, en lui confiant une
tâche, en lui parlant (summonAgent), ou par ses déclencheurs et ses actions.
"""
type Agent {
  "Identifiant de l'agent : celui de son utilisateur."
  id: ID!
  user: User!
  name: String!
  project: Project!
  kind: AgentKind!
  avatar: AgentAvatar!
  description: String!
  "Markdown ajouté au prompt système de ses sessions, après le prompt du projet."
  instructions: String!
  "Ses sessions sur une tâche travaillent dans le dossier de la tâche (branche task/…) ; sinon un dossier à part par session."
  taskFolder: Boolean!
  "Réglages par défaut de ses sessions (même forme que la configuration d'une session : permissionMode, allowedTools, model…, plus provider : le type de session)."
  defaults: JSON!
  "Modèles que ses sessions peuvent utiliser (vide : tous) ; le modèle par défaut en fait partie."
  allowedModels: [String!]!
  "En plus de sa propre bibliothèque de contexte, l'agent reçoit celle du projet."
  inheritContext: Boolean!
  "Comptes prêtés à l'agent par une personne (sinon ses comptes propres)."
  delegations: AgentDelegations!
  triggers: AgentTriggers!
  actions: [AgentAction!]!
  "En pause : ne réagit ni aux déclencheurs ni aux mentions."
  enabled: Boolean!
  archivedAt: DateTime
  managers: [AgentManager!]!
  "L'utilisateur connecté peut modifier l'agent (gestionnaire, ou administrateur du projet)."
  canManage: Boolean!
  stats: AgentStats!
  "Ses sessions, les plus récentes d'abord (archivées comprises)."
  sessions(limit: Int): [Session!]!
  "Tâches où il est intervenu, les plus récentes d'abord."
  tasks(limit: Int): [Task!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Modèle de départ d'un agent."
type AgentTemplate {
  kind: AgentKind!
  label: String!
  suggestedName: String!
  avatar: AgentAvatar!
  description: String!
  instructions: String!
  taskFolder: Boolean!
  defaults: JSON!
  triggers: AgentTriggers!
  actions: [AgentAction!]!
}

input AgentAvatarInput {
  emoji: String
  color: String
}

input AgentTriggersInput {
  taskCreated: Boolean
  taskCreatedTag: String
  threadFollowed: Boolean
  prMerged: Boolean
  taskReady: Boolean
  taskReadyTag: String
}

input AgentActionInput {
  "Absent : dérivé du libellé."
  key: String
  label: String!
  instruction: String!
  cron: String
  timezone: String
}

input AgentInput {
  name: String
  kind: AgentKind
  inheritContext: Boolean
  avatar: AgentAvatarInput
  description: String
  instructions: String
  taskFolder: Boolean
  "Réglages par défaut : provider (type de session : claude, opencode), model, permissionMode, allowedTools…"
  defaults: JSON
  "Remplace la liste des modèles autorisés (vide : tous)."
  allowedModels: [String!]
  triggers: AgentTriggersInput
  "Remplace la liste complète (les sessions planifiées des actions retirées sont supprimées)."
  actions: [AgentActionInput!]
}

input AgentManagerInput {
  userId: ID!
  role: AgentManagerRole!
}

enum AgentAccountKind {
  "Réglages Claude (identifiants, modèle par défaut, budgets)."
  CLAUDE
  "Comptes GitHub."
  GITHUB
  "Comptes GitLab."
  GITLAB
  "GitHub et GitLab ensemble (ancienne forme, gardée pour les clients pas encore rechargés)."
  GIT @deprecated(reason: "Prêter GITHUB et GITLAB séparément")
}

type AgentDelegations {
  "Personne qui prête son compte Claude (null : les réglages Claude propres de l'agent)."
  claude: User
  "Personne qui prête son compte GitHub (null : les comptes GitHub propres de l'agent)."
  github: User
  "Compte GitHub prêté en lecture seule : ni push, ni pull request (sauf githubPullRequests)."
  githubReadOnly: Boolean!
  "L'agent peut ouvrir des pull requests GitHub (tasks.pr_open pousse sa branche de travail), même en lecture seule."
  githubPullRequests: Boolean!
  "Personne qui prête son compte GitLab (null : les comptes GitLab propres de l'agent)."
  gitlab: User
  "Compte GitLab prêté en lecture seule : ni push, ni merge request (sauf gitlabPullRequests)."
  gitlabReadOnly: Boolean!
  "L'agent peut ouvrir des merge requests GitLab (tasks.pr_open pousse sa branche de travail), même en lecture seule."
  gitlabPullRequests: Boolean!
  git: User @deprecated(reason: "Utiliser github et gitlab")
  gitReadOnly: Boolean! @deprecated(reason: "Utiliser githubReadOnly et gitlabReadOnly")
}

extend type Query {
  agent(id: ID!): Agent
  agentTemplates: [AgentTemplate!]!
  "Agents actifs des projets de l'utilisateur connecté (« Parler à… »)."
  myAgents: [Agent!]!
}

extend type Mutation {
  "Crée un agent dans le projet (administrateur ou membre) ; le créateur en est le propriétaire."
  createAgent(projectId: ID!, input: AgentInput!): Agent!
  updateAgent(id: ID!, input: AgentInput!): Agent!
  setAgentEnabled(id: ID!, enabled: Boolean!): Agent!
  "Retire l'agent du projet (profil archivé, sessions planifiées supprimées) ; son historique reste."
  deleteAgent(id: ID!): Boolean!
  setAgentManagers(id: ID!, managers: [AgentManagerInput!]!): Agent!
  "Convoque l'agent avec un message : dans sa session reliée à la tâche, sinon dans une nouvelle session (sur la tâche ou libre). Renvoie la session."
  summonAgent(id: ID!, text: String!, taskId: ID, attachments: [AttachmentInput!]): Session!
  "Prête son propre compte à l'agent (delegate: true) ou retire la délégation (false) ; pour les comptes git, readOnly (défaut : vrai) et pullRequests (en lecture seule, l'agent peut quand même ouvrir des pull requests ; défaut : faux). Une option absente garde sa valeur quand le prêt ne change pas de personne."
  setAgentDelegation(id: ID!, account: AgentAccountKind!, delegate: Boolean!, readOnly: Boolean, pullRequests: Boolean): Agent!
  "Joue une action nommée de l'agent, éventuellement sur une tâche."
  runAgentAction(id: ID!, key: String!, taskId: ID): Session!
  "Prend la main sur la session d'un agent : elle continue (même conversation, au nom de l'agent) avec les comptes et les droits de la personne connectée (Claude, GitHub, GitLab, coffre). Demandeur de la session, gestionnaire de l'agent ou administrateur du projet. En cours, appliqué après la fin du tour."
  takeOverSession(id: ID!): Session!
  "Rend la session à son agent : elle reprend les comptes de l'agent."
  handBackSession(id: ID!): Session!
}

extend type Project {
  "Agents du projet (non retirés)."
  agents: [Agent!]!
}

extend type User {
  kind: UserKind!
  "Profil d'agent (null pour une personne)."
  agent: Agent
}

extend type Session {
  "Personne qui a demandé la session quand son propriétaire est un agent (chat avec l'agent, tâche confiée)."
  requestedBy: User
  "Agent qui joue la session (null : session d'une personne)."
  agent: Agent
  "Personne qui a pris la main sur la session d'un agent (ses comptes et ses droits servent la session) ; null : les comptes de l'agent."
  takenOverBy: User
  takenOverAt: DateTime
  "La personne connectée peut prendre (ou rendre) la main sur cette session d'agent."
  viewerCanTakeOver: Boolean!
}

extend type TaskComment {
  "Agent dont la session a écrit le message (null sinon)."
  agent: Agent
}

# ---- Conversations d'équipe (canaux) ----------------------------------------------------------------

"Canal de conversation d'un projet (« général », « livraisons »…) : des messages en fil, à la Slack, où l'on mentionne personnes et agents."
type Conversation {
  id: ID!
  project: Project!
  "Nom technique, unique dans le projet (« general »)."
  slug: String!
  name: String!
  topic: String!
  lastMessageAt: DateTime
  archivedAt: DateTime
  createdAt: DateTime!
  "Messages des autres postés après la dernière lecture de l'utilisateur connecté."
  unreadCount: Int!
  messageCount: Int!
  "Les derniers messages racines (limit, défaut 50 ; before : plus anciens que cette date) avec toutes leurs réponses, à plat, du plus ancien au plus récent."
  messages(before: DateTime, limit: Int): [Message!]!
  "Qui l'on peut mentionner : membres du projet (dont les agents), puis sessions d'agent non archivées."
  mentionables: [TaskMentionable!]!
}

"Message d'un canal : racine, ou réponse dans le fil d'une racine (parentId)."
type Message {
  id: ID!
  conversationId: ID!
  parentId: ID
  "'human' ou 'agent'."
  authorType: String!
  authorName: String!
  author: User
  authorSession: Session
  "Agent de projet dont la session a écrit le message (null sinon)."
  agent: Agent
  body: String!
  mentions: [TaskMention!]!
  reactions: [TaskReaction!]!
  editable: Boolean!
  deletable: Boolean!
  "Pour un message racine : nombre de réponses et date de la dernière."
  replyCount: Int!
  lastReplyAt: DateTime
  "Sessions reliées au fil (message racine) dont l'agent travaille en ce moment : « X répond… »."
  respondingSessions: [Session!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

extend type Project {
  "Canaux du projet (le général d'abord, créé au besoin)."
  conversations(includeArchived: Boolean): [Conversation!]!
  "Messages non lus par l'utilisateur connecté, tous canaux confondus."
  unreadMessages: Int!
}

extend type Query {
  conversation(id: ID!): Conversation
  "Canal d'un projet par son nom technique."
  conversationBySlug(projectId: ID!, slug: String!): Conversation
}

extend type Mutation {
  "Crée un canal (membres du projet)."
  createConversation(projectId: ID!, name: String!, topic: String): Conversation!
  updateConversation(id: ID!, name: String, topic: String): Conversation!
  "Archive ou rouvre un canal (administrateurs) ; le canal général ne s'archive pas."
  setConversationArchived(id: ID!, archived: Boolean!): Conversation!
  "Poste un message (Markdown) ; parentId : réponse dans le fil d'un message. Les mentions (@Nom, @e-mail, @session:<id>) sont résolues : personnes notifiées, agents convoqués, sessions reliées au fil."
  postMessage(conversationId: ID!, body: String!, parentId: ID): Message!
  "Ses propres messages seulement."
  updateMessage(id: ID!, body: String!): Message!
  "Ses propres messages, ou administrateur du projet (les réponses partent avec une racine)."
  deleteMessage(id: ID!): Boolean!
  "Pose une réaction, ou la retire si l'utilisateur l'avait déjà posée. Renvoie true si elle est posée."
  toggleMessageReaction(messageId: ID!, emoji: String!): Boolean!
  "Marque le canal lu jusqu'à maintenant pour l'utilisateur connecté."
  markConversationRead(id: ID!): Boolean!
}

# ---- Tableau de bord d'un projet --------------------------------------------------------------------

"Un membre du projet (personne ou agent) et ce qu'il fait en ce moment."
type ProjectTeamMember {
  user: User!
  "Fiche de l'agent, pour un membre agent."
  agent: Agent
  "Sessions en cours qu'il joue (agent) ou qu'il pilote (personne)."
  sessions: [Session!]!
  "Tâches dont ses sessions en cours ont la charge."
  tasks: [Task!]!
  "Dernière activité connue : sa dernière session, sinon sa dernière connexion."
  lastActivityAt: DateTime
}

"Tableau de bord d'un projet : la vue d'ensemble de l'accueil restreinte au projet, plus l'équipe, le canal général, les planifications et les tâches pour le flux."
type ProjectDashboard {
  generatedAt: DateTime!
  counts: DashboardCounts!
  usage: DashboardUsage!
  pendingRequests: [Request!]!
  runningSessions: [Session!]!
  recentSessions: [Session!]!
  attentionTasks: [Task!]!
  "Pull requests qui attendent une action (à fusionner, brouillons)."
  pullRequests: [TrackedPullRequest!]!
  "Pull requests fusionnées récemment."
  mergedPullRequests: [TrackedPullRequest!]!
  "Tâches en cours dont aucune session en charge ne tourne : l'agent s'est arrêté sans les terminer."
  staleTasks: [Task!]!
  "Planifications du projet, prochaine échéance d'abord."
  schedules: [SessionSchedule!]!
  "Le canal général du projet (null pour un espace personnel)."
  general: Conversation
  "Membres (agents d'abord) et ce qu'ils font."
  team: [ProjectTeamMember!]!
  "Tâches du projet, tous statuts, créées ou mises à jour depuis 13 semaines (flux par étiquette d'état, débit, dernières terminées)."
  tasks: [Task!]!
}

extend type Query {
  projectDashboard(id: ID!): ProjectDashboard!
}
