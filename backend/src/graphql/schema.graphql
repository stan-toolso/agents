# ---- Workflows -------------------------------------------------------------------------------

"Statut d'une exécution de workflow ; QUEUED : exécution déclenchée par un événement, en attente d'une place."
enum RunStatus {
  QUEUED
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

"Ce qui a lancé l'exécution ; EVENT : un événement du projet (une tâche créée)."
enum RunTrigger {
  MANUAL
  SCHEDULE
  WORKFLOW
  TEST
  EVENT
}

"Variable déclarée par un déclencheur de workflow, remplie au lancement (disponible comme {{input.<clé>}})."
type InputVariable {
  key: String!
  label: String!
  description: String
  required: Boolean!
  defaultValue: String
}

"Planification d'un workflow."
type AutomationSchedule {
  cron: String!
  timezone: String!
  enabled: Boolean!
  nextRunAt: DateTime
  lastRunAt: DateTime
  "Issue de la dernière exécution planifiée (une ligne)."
  lastResult: String
}

input AutomationScheduleInput {
  cron: String!
  timezone: String
  enabled: Boolean
}

"Éléments du coffre utilisables par la personne pour les nœuds « appel de modèle » des workflows : proxys LiteLLM, projets Langfuse, jetons OpenAI et Anthropic."
type LlmKeys {
  litellm: [VaultItem!]!
  langfuse: [VaultItem!]!
  tokens: [VaultItem!]!
}

"Problème trouvé dans le graphe d'un workflow : les erreurs bloquent les exécutions, pas les avertissements."
type WorkflowIssue {
  nodeKey: String
  edgeId: String
  severity: String!
  message: String!
}

"""
Un workflow : un graphe de nœuds (déclencheur, appel de modèle, tâche, session, création de tâche, condition,
fin) et d'arêtes à branches (oui / non, en cas d'erreur), lancé à la main, par planification ou par une tâche créée.
La définition est enregistrée telle que l'éditeur la dessine :
{ nodes: [{ key, type, label, position, … }], edges: [{ id, source, target, sourceHandle? }] }.
"""
type Workflow {
  id: ID!
  project: Project!
  name: String!
  description: String!
  definition: JSON!
  "Un workflow en pause ignore ses exécutions planifiées et ses déclencheurs (les lancements manuels restent possibles)."
  enabled: Boolean!
  "Problèmes du graphe courant."
  issues: [WorkflowIssue!]!
  "Variables d'un déclencheur du workflow ; sans clé, de son déclencheur par défaut (premier manuel, sinon premier)."
  variables(triggerKey: String): [InputVariable!]!
  schedule: AutomationSchedule
  scheduleInputs: JSON!
  "Personne dont les comptes servent aux exécutions déclenchées par un événement (la dernière à avoir enregistré le déclencheur)."
  eventOwner: User
  runs(limit: Int): [WorkflowRun!]!
  lastRun: WorkflowRun
  createdBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateWorkflowInput {
  projectId: ID!
  name: String!
  description: String
  definition: JSON
  enabled: Boolean
}

input UpdateWorkflowInput {
  name: String
  description: String
  definition: JSON
  enabled: Boolean
}

type WorkflowRun {
  id: ID!
  workflow: Workflow!
  project: Project!
  trigger: RunTrigger!
  "Clé du nœud déclencheur de départ."
  triggerKey: String
  status: RunStatus!
  "Le graphe tel qu'il était au lancement."
  definition: JSON!
  inputs: JSON!
  "Sortie du ou des nœuds de fin atteints."
  output: JSON
  error: String
  costUsd: Float!
  cancelRequested: Boolean!
  nodes: [WorkflowRunNode!]!
  logs(after: ID, limit: Int): [WorkflowRunLog!]!
  owner: User
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
}

"État d'un nœud dans une exécution."
type WorkflowRunNode {
  id: ID!
  nodeKey: String!
  nodeType: String!
  "pending, running, succeeded, failed, skipped, cancelled."
  status: String!
  input: JSON
  "Sortie du nœud : { output, json, task?, sessionId?, branch?, model? … }."
  output: JSON
  error: String
  "Session ouverte par un nœud « tâche » ou « session »."
  session: Session
  startedAt: DateTime
  finishedAt: DateTime
}

type WorkflowRunLog {
  id: ID!
  nodeKey: String
  "debug, info, warn, error."
  level: String!
  message: String!
  data: JSON
  createdAt: DateTime!
}

