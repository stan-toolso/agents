  "CLEAN, BLOCKED, BEHIND, DIRTY, UNSTABLE, HAS_HOOKS, DRAFT, UNKNOWN"
  mergeStateStatus: String!
  "APPROVED, CHANGES_REQUESTED, REVIEW_REQUIRED, ou null (pas de revue exigée)."
  reviewDecision: String
  "État agrégé des checks du dernier commit : SUCCESS, FAILURE, PENDING, ERROR, EXPECTED, ou null (aucun check)."
  checksState: String
  checks: [PullRequestCheck!]!
  reviews: [PullRequestReview!]!
  additions: Int!
  deletions: Int!
  changedFiles: Int!
  commitCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  mergedAt: DateTime
  closedAt: DateTime
  "Work session du projet sur la branche de la PR, s'il en existe une."
  worksession: Worksession
  "Tâches du projet traitées sur la branche de la PR."
  tasks: [Task!]!
}

"Proposition de pull request pour la branche courante d'un workspace."
type PullRequestDraft {
  branch: String!
  base: String!
  "Titre proposé : tâche liée à la branche, sinon commit unique, sinon nom de la branche."
  title: String!
  "Description proposée : tâche et liste des commits."
  body: String!
  commits: [GitCommitRef!]!
  "La branche n'a pas de branche distante : la création la poussera."
  needsPush: Boolean!
  "Pull request déjà ouverte pour cette branche."
  existing: PullRequest
}

type GitCommitRef {
  hash: String!
  subject: String!
}

"Résultat d'une fusion et du nettoyage demandé."
type MergePullRequestResult {
  pullRequest: PullRequest!
  "Commit de fusion."
  sha: String
  deletedWorksessionIds: [ID!]!
  completedTaskIds: [ID!]!
  "Étapes de nettoyage non réalisées, avec leur raison."
  warnings: [String!]!
}

input MergePullRequestCleanup {
  "Supprime la branche sur GitHub."
  deleteRemoteBranch: Boolean = true
  "Supprime le(s) worksession(s) de la branche et la branche locale."
  deleteWorksession: Boolean = true
  "Arrête les sessions encore ouvertes dans ces work sessions (sinon elles sont conservées). Leur historique est gardé."
  stopSessions: Boolean = false
  "Passe à « terminée » les tâches ouvertes traitées sur cette branche."
  completeTasks: Boolean = true
}

"Statut d'une pull request suivie : en préparation (pas encore ouverte sur GitHub), ouverte, fusionnée, fermée sans fusion (annulée)."
enum TrackedPullRequestStatus {
  PENDING
  OPEN
  MERGED
  CLOSED
}

"Étape d'une pull request suivie, dérivée de son statut et de son brouillon."
enum PullRequestStage {
  "En préparation : la branche porte des modifications, aucune pull request n'est ouverte."
  PENDING
  "Ouverte en brouillon."
  DRAFT
  "Ouverte : à relire et fusionner."
  TO_MERGE
  "Fusionnée."
  MERGED
  "Fermée sans fusion."
  CANCELLED
}

"""
Pull request suivie : l'objet qui matérialise une PR dans Skipper, rattaché à un projet et le plus souvent à une tâche.
Elle existe avant GitHub (« en préparation » : une branche porte des modifications sans PR ouverte) et peut viser un
autre dépôt que celui du projet. Créée par la synchronisation (travail local des branches, PR GitHub adoptées), par une
session d'agent (outils tasks.pr_open / pr_register) ou par l'interface ; son statut et son instantané GitHub sont
rafraîchis à la synchronisation.
"""
type TrackedPullRequest {
  id: ID!
  project: Project!
  task: Task
  "Dépôt GitHub « owner/name » de la PR (celui du projet le plus souvent) ; vide sans GitHub."
  repo: String!
  "La PR est dans un autre dépôt que celui du projet."
  foreignRepo: Boolean!
  "Numéro GitHub ; null tant que la PR est en préparation."
  number: Int
  "URL GitHub ; vide tant que la PR est en préparation."
  url: String!
  "Work session (branche) dont la PR suit le travail, quand elle est connue."
  worksession: Worksession
  "PR en préparation : commits en avance sur la base, constatés à la dernière synchronisation."
  localCommits: Int
  "PR en préparation : fichiers modifiés non commités, constatés à la dernière synchronisation."
  localChanges: Int
  title: String!
  headBranch: String!
  baseBranch: String!
  status: TrackedPullRequestStatus!
  isDraft: Boolean!
  stage: PullRequestStage!
  "Instantané GitHub du dernier rafraîchissement : SUCCESS, FAILURE, PENDING, ERROR, EXPECTED, ou null."
  checksState: String
  "APPROVED, CHANGES_REQUESTED, REVIEW_REQUIRED, ou null."
  reviewDecision: String
  "MERGEABLE, CONFLICTING, UNKNOWN, ou null."
  mergeable: String
  syncedAt: DateTime
  "Commit de fusion, quand la fusion a été faite depuis Skipper."
  mergeSha: String
  "Note libre de suivi (« attend la CI », « revue demandée »…)."
  note: String!
  "'human', 'agent' ou 'system' (synchronisation GitHub)."
  createdByType: String!
  createdBy: User
  createdBySession: Session
  "Ouverture sur GitHub."
  openedAt: DateTime!
  mergedAt: DateTime
  closedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  "La PR GitHub en direct (checks, revues, fusion), null si GitHub ne répond pas."
  github: PullRequest
  """
  Session d'agent rattachée : la session (non archivée) la plus récente du dossier de travail de la branche de la PR,
  sinon celle qui a ouvert la PR. C'est elle qui reçoit la demande de résolution des conflits.
  """
  session: Session
}

input UpdateTrackedPullRequestInput {
  "OPEN, MERGED ou CLOSED (annulée)."
  status: TrackedPullRequestStatus
  "Remplace la note ; chaîne vide pour la retirer."
  note: String
  "Tâche reliée ; null pour détacher."
  taskId: ID
}

"Souvenir d'une work session supprimée, gardé par les sessions archivées avec elle."
type FormerWorksession {
  name: String!
  branch: String!
  label: String!
}

"Session d'agent ordinaire, ou chat : conversation légère d'un espace personnel, sans work session ni conteneur."
enum SessionKind {
  SESSION
  CHAT
}

type Session {
  id: ID!
  kind: SessionKind!
  project: Project!
  "Work session où la session s'exécute (null : session d'avant les work sessions, dans le checkout principal, ou work session supprimée)."
  worksession: Worksession
  "Utilisateur qui a lancé la session ; null : session d'avant cette version ou ouverte à tous les membres."
  owner: User
  "Archivée : cachée des listes actives, consultable et relançable depuis l'historique du projet."
  archivedAt: DateTime
  "Work session supprimée où la session a travaillé (elle a été archivée avec elle) ; null sinon."
  formerWorksession: FormerWorksession
  "Première des tâches dont la session est en charge (voir tasks)."
  task: Task
  "Tâches dont la session est en charge, la plus récemment prise d'abord."
  tasks: [Task!]!
  "Session d'agent qui a lancé celle-ci (outil MCP sessions.create) ; null pour une session lancée par un humain."
  parentSession: Session
  "Sessions lancées par l'agent de cette session."
  childSessions: [Session!]!
  "Exécution de workflow qui a ouvert la session (nœud tâche ou session) ; null pour une session lancée à la main."
  workflowRun: WorkflowRun
  name: String!
  provider: String!
  status: SessionStatus!
  activity: SessionActivity
  "Première instruction de la session."
  prompt: String
  "Fichiers joints à la première instruction."
  promptAttachments: [Attachment!]!
  config: JSON!
  externalId: String
  exitCode: Int
  error: String
  "Coût estimé cumulé de la session (USD, tarif API)."
  costUsd: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  endedAt: DateTime
  "Événements journalisés, dans l'ordre chronologique. `after` = id du dernier événement déjà reçu."
  events(after: ID, limit: Int): [SessionEvent!]!
  requests(status: RequestStatus): [Request!]!
  "Nombre de demandes en attente d'une réponse humaine."
  pendingRequestCount: Int!
  "Le navigateur headless de la session est ouvert et l'agent s'en est servi : vue en direct sur le WebSocket /browsers/<id>."
  browserActive: Boolean!
  "Réponse en cours d'écriture par l'agent (texte reçu en streaming, pas encore journalisé) ; null quand il n'écrit pas."
  liveDraft: SessionLiveDraft
  "Mise en file d'attente (statut QUEUED)."
  queuedAt: DateTime
  "Rang dans la file d'attente (1 : la prochaine à démarrer), null hors de la file."
  queuePosition: Int
  "Session de relecture de code (lecture seule) : ce qu'elle relit et son rapport ; null pour une session ordinaire."
  review: SessionReview
}

"Revue de code par un agent : branche relue, publication du rapport."
type SessionReview {
  branch: String
  "Branche de base comparée (ex. origin/main)."
  baseBranch: String!
  commits: Int!
  pullRequest: TrackedPullRequest
  task: Task
  "Rapport publié (null tant que l'agent n'a pas conclu)."
  reportedAt: DateTime
  "Rapport de l'agent (Markdown)."
  report: String
  "La relecture n'a pas abouti."
  error: String
  "Commentaire posté sur la PR GitHub."
  githubCommentUrl: String
  "Le commentaire GitHub n'a pas pu être posté."
  githubError: String
}

enum RequestStatus {
  PENDING
  ANSWERED
  CANCELLED
  EXPIRED
}

"Demande d'intervention humaine émise par un agent : autorisation d'outil, question, saisie..."
type Request {
  id: ID!
  session: Session!
  "'permission', 'question', 'input', ... (extensible)"
  type: String!
  status: RequestStatus!
  title: String!
  message: String
  "Données propres au type : { toolName, input, suggestions } pour 'permission', { questions } pour 'question'."
  payload: JSON!
  "Réponse fournie : { decision: allow|deny, always?, message? } pour 'permission', { answers: { question: réponse } } pour 'question'."
  response: JSON
  "Qui a répondu ou annulé."
  answeredBy: User
  createdAt: DateTime!
  answeredAt: DateTime
}

"Fichier joint à une instruction ; téléchargeable sur GET /api/attachments/<session>/<id> (cookie de session)."
type Attachment {
  id: ID!
  name: String!
  mediaType: String!
  size: Int!
}

"Brouillon en direct : ce que l'agent écrit en ce moment, avant le message complet dans les événements."
type SessionLiveDraft {
  text: String!
  "L'agent est dans un bloc de réflexion."
  thinking: Boolean!
}

type SessionEvent {
  id: ID!
  sessionId: ID!
  type: String!
  payload: JSON!
  createdAt: DateTime!
}

